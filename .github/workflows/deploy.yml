name: CI/CD Auto-Deploy to Proxmox CT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Install & Deploy Laravel on Proxmox CT
    runs-on: self-hosted

    env:
      HOME: /root
      COMPOSER_HOME: /root/.composer
      COMPOSER_ALLOW_SUPERUSER: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Auto-Installation and Deployment
        run: |
          export HOME=/root
          export COMPOSER_HOME=/root/.composer
          export COMPOSER_ALLOW_SUPERUSER=1
          chmod +x ./install.sh
          if [ "$EUID" -ne 0 ]; then
            sudo -E bash ./install.sh || sudo bash ./install.sh || bash ./install.sh
          else
            bash ./install.sh
          fi
